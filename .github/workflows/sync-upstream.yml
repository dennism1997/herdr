name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/sync_upstream.py'
      - 'scripts/test_sync_upstream.py'

permissions:
  contents: read

concurrency:
  group: sync-upstream-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest scripts.test_sync_upstream -v

  sync:
    if: github.repository == 'dennism1997/herdr' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          fetch-depth: 0
      - name: Merge and push upstream master
        run: python3 scripts/sync_upstream.py
